name: Import project datasets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/prepare_datasets.py
      - data/sources.lock.json
      - .github/workflows/import-datasets.yml
permissions:
  contents: write
concurrency:
  group: dataset-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download pinned sources and prepare data
        run: python3 scripts/prepare_datasets.py
      - name: Validate generated data
        run: python3 scripts/validate_datasets.py
      - name: Commit dataset files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/processed data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: import verified ABCD, Olist and e-commerce support conversations"
          git push origin HEAD:main
